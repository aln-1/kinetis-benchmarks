x-db-env: &db_env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_NAME: tfbench
  DB_USER: tfbench
  DB_PASSWORD: tfbench
  DB_PORT: "3306"

x-app-sysctls: &app_sysctls
  net.ipv4.ip_local_port_range: "1024 65535"
  net.ipv4.tcp_tw_reuse: "1"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tfbench
      MYSQL_USER: tfbench
      MYSQL_PASSWORD: tfbench
      MYSQL_ROOT_PASSWORD: root
    command: ["--max-connections=1000", "--max-connect-errors=1000000"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: mysql:8.4
    volumes:
      - ./schema/seed.sql:/seed.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: ["mysql --default-character-set=utf8mb4 -h mysql -u root -proot tfbench < /seed.sql"]

  kinetis:
    build:
      context: kinetis
      dockerfile: docker/Dockerfile
    environment:
      <<: *db_env
      APP_ENV: production
      KINETIS_WORKER_THREADS: "2"
    sysctls: *app_sysctls
    ports:
      - "8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # The same Kinetis application as the target above, served by RoadRunner
  # (rr serve) instead of FrankenPHP worker mode. public/index.php is
  # unchanged — Kinetis's RuntimeDetector picks the right adapter on its
  # own — so only the Dockerfile/composer.json (kinetis/roadrunner-adapter
  # added) and .rr.yaml differ; src/ and public/ are copied straight from
  # kinetis/, not duplicated.
  kinetis-roadrunner:
    build:
      context: .
      dockerfile: kinetis-roadrunner/Dockerfile
    environment:
      <<: *db_env
      APP_ENV: production
    sysctls: *app_sysctls
    ports:
      - "8092:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # RoadRunner's own framework, on RoadRunner — the other reference point
  # for the kinetis-roadrunner comparison above. Raw SQL via Cycle's DBAL
  # only, no ORM entities/schema — the same minimal-target style every
  # other benchmark entry here uses.
  spiral-roadrunner:
    build:
      context: spiral-roadrunner
    environment:
      <<: *db_env
    sysctls: *app_sysctls
    ports:
      - "8093:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  kinetis-fpm:
    build:
      context: .
      dockerfile: kinetis-fpm/Dockerfile
