  # The same Slim application as the target above, served by FrankenPHP
  # in worker mode instead of nginx + PHP-FPM. Identical source, lock
  # file, worker count, and resource limits, so the pair isolates the
  # runtime rather than the framework.
  slim-frankenphp:
    build:
      context: slim-frankenphp
